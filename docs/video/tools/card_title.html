<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; width: 1600px; height: 900px; background: #060b11; overflow: hidden; }
  body {
    font-family: Inter, 'Segoe UI', system-ui, sans-serif;
    color: #dce8f2; display: flex; flex-direction: column; justify-content: center;
    align-items: center; position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 50% 42%, rgba(90,200,255,.10), transparent 58%),
      repeating-linear-gradient(0deg, rgba(120,170,210,.055) 0 1px, transparent 1px 60px),
      repeating-linear-gradient(90deg, rgba(120,170,210,.055) 0 1px, transparent 1px 60px);
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .kicker { font-family: 'JetBrains Mono', monospace; font-size: 15px; letter-spacing: .30em; color: #6f8ba3; margin-bottom: 26px; }
  h1 { font-size: 92px; letter-spacing: .16em; margin: 0; font-weight: 700; color: #eaf6ff; }
  .sub { margin-top: 18px; font-size: 23px; color: #9fb6ca; letter-spacing: .01em; text-align: center; max-width: 1080px; line-height: 1.45; }
  .pipeline { margin-top: 42px; font-family: 'JetBrains Mono', monospace; font-size: 15px; letter-spacing: .22em; color: #56d6c8; }
  .foot { position: absolute; bottom: 56px; font-family: 'JetBrains Mono', monospace; font-size: 13.5px; letter-spacing: .16em; color: #5f7b91; }
  .rule { width: 190px; height: 2px; background: linear-gradient(90deg, transparent, #56d6c8, transparent); margin: 30px 0 0; }
  .beacon { position: absolute; top: 0; left: 50%; width: 320px; height: 3px; transform: translateX(-50%); background: linear-gradient(90deg, transparent, #56d6c8, transparent); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="beacon"></div>
  <div class="kicker">SMART INDIA HACKATHON · MINISTRY OF EARTH SCIENCES · NCPOR</div>
  <h1>POLARIS-X</h1>
  <div class="rule"></div>
  <div class="sub">AI-enabled Antarctic sea-ice, iceberg trajectory<br />and navigation decision support system</div>
  <div class="pipeline">OBSERVE &nbsp;·&nbsp; PREDICT &nbsp;·&nbsp; ASSESS &nbsp;·&nbsp; OPTIMIZE &nbsp;·&nbsp; DECIDE</div>
  <div class="foot">LIVE MODE · NSIDC SEA ICE · USNIC ICEBERGS · BYU/NIC TRACKS · OPEN-METEO WIND</div>
</body>
</html>
